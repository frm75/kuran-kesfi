server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name kurankesfi.tr www.kurankesfi.tr;

    # Tamamen statik site (Astro). PHP yok, uygulama sunucusu yok, veritabani
    # yok. index'ten php girdileri kaldirildi.
    index index.html;

    # Atomik yayin: 'current' bir sembolik bag, releases/<zaman> dizinine
    # bakar. Yeni surum once yeni bir releases/ dizinine yazilir, sonra bag
    # tek islemde degistirilir; yarim yayinlanmis site olmaz.
    # Ayrinti: scripts/deploy/deploy.sh, docs/DEPLOY_REPORT.md 3.9
    root /www/wwwroot/kurankesfi.tr/current;

    include /www/server/panel/vhost/nginx/extension/kurankesfi.tr/*.conf;

    #CERT-APPLY-CHECK--START
    # Configuration related to file verification for SSL certificate application - Do not delete
    include /www/server/panel/vhost/nginx/well-known/kurankesfi.tr.conf;
    #CERT-APPLY-CHECK--END
    #SSL-START SSL related configuration, do NOT delete or modify the next line of commented-out 404 rules
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/kurankesfi.tr/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/kurankesfi.tr/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";

    # --- Gizlilik ve guvenlik basliklari -------------------------------------
    # Site ucuncu taraftan HICBIR sey yuklemez: reklam yok, analitik yok,
    # font CDN'i yok (plan 1.3, 1.7). CSP bunu iddia degil KURAL yapar.
    #
    # script-src default-src 'none'a duser: bugun sitede 0 bayt JavaScript var.
    # Ilerde Astro island'i eklenirse (Faz 1: harita, graf, arama) buraya
    # script-src 'self' EKLENMELIDIR, yoksa sessizce calismaz.
    #
    # style-src 'unsafe-inline': Astro kucuk stilleri <style> olarak gomebiliyor.
    # Harici stil yine yasak; satir ici stil veri disari sizdiramaz.
    #
    # media-src 'self' (2026-09-04): tanitim sayfasinin hero videosu icin
    # eklendi. YALNIZCA kendi alan adimiz — ucuncu taraf medya hala yasak.
    # 'none' iken <video> sessizce engelleniyordu; hata da vermiyordu.
    # script-src ACILMADI: video betik gerektirmiyor, sayfa 0 bayt JS kaliyor.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()";
    add_header Cross-Origin-Opener-Policy "same-origin";
    # ---------------------------------------------------------------------
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START  Error page configuration, allowed to be commented, deleted or modified
    error_page 404 /404.html;
    error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP reference configuration, allowed to be commented, deleted or modified
    # PHP kapali: site tamamen statik. (enable-php-00.conf zaten bos dosyaydi.)
    # include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL rewrite rule reference, any modification will invalidate the rewrite rules set by the panel
    include /www/server/panel/vhost/rewrite/kurankesfi.tr.conf;
    #REWRITE-END

    # Forbidden files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    # Directory verification related settings for one-click application for SSL certificate
    location ~ \.well-known{
        allow all;
    }

    #Prohibit putting sensitive files in certificate verification directory
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # --- Statik site yonlendirmesi -------------------------------------------
    # Astro build.format="file" ile uretiyor:
    #   /sureler           -> sureler.html
    #   /bakara-suresi     -> bakara-suresi.html
    #   /bakara-suresi/153 -> bakara-suresi/153.html
    # Bu satir olmadan ana sayfa disindaki her adres 404 verir.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Astro'nun uretim varliklari icerik ozetiyle adlandirilir
    # (index.Br6nmY1G.css); icerik degisirse ad degisir, bu yuzden
    # uzun sureli onbellek guvenli.
    # NOT: burada add_header KULLANILMAZ. Nginx'te bir location'daki add_header
    # sunucu duzeyindeki TUM add_header'lari (HSTS, CSP...) devre disi birakir.
    # 'expires' Cache-Control'u add_header'a dokunmadan yazar.
    location ^~ /_astro/ {
        expires 1y;
        access_log off;
    }

    # Fontlar sabit adli (karla-latin.woff2). Icerik degisebilir, bu yuzden
    # 'immutable' degil; 30 gun yeterli.
    location ^~ /fonts/ {
        expires 30d;
        access_log off;
    }

    # Marka gorselleri (logo, favicon, og-image) — sabit adli, seyrek degisir.
    location ^~ /brand/ {
        expires 30d;
        access_log off;
    }

    # Hero videosu ve posteri. 763 KB; her ziyarette yeniden inmesin diye
    # uzun onbellek. Icerik degisirse dosya adi degil onbellek suresi
    # beklenir — bu yuzden 'immutable' YAZILMIYOR.
    location ^~ /media/ {
        expires 30d;
        access_log off;
    }

    # Uretilen JSON verisi her build'de degisebilir; kisa onbellek.
    location ^~ /data/ {
        expires 1h;
    }
    # ---------------------------------------------------------------------

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null; 
    }
    access_log  /www/wwwlogs/kurankesfi.tr.log;
    error_log  /www/wwwlogs/kurankesfi.tr.error.log;
}
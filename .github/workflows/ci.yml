# Her push ve PR'da veritabanisiz calisabilen kontroller.
#
# Kapsam disi (bilerek):
#   - lint:refs ve build: PostgreSQL ister (scripts/build -> @kuran/pipeline pool).
#   - bot test:data (content.smoke.ts): takvim ve mesaj testleri
#     apps/web/public/data ister; o dizin build ciktisidir ve git'e girmez.
#     Sunucuda `pnpm test` ile calismaya devam eder. Gonderim zamani testleri
#     (dispatch.smoke.ts) veri istemez ve asagida calisir.
#   - fonts:verify ve deploy: sunucu/yerel makine isi.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # Surum package.json -> packageManager alanindan okunur.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm -r typecheck
      - run: pnpm --filter @kuran/schema test:smoke
      - run: pnpm --filter @kuran/web test:smoke
      - run: pnpm --filter @kuran/bot test:smoke
